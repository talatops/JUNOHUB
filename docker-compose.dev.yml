services:
  app:
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    restart: unless-stopped

volumes:
  app_node_modules:
  app_next:
